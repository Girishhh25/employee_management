<div class="list-card">

  <div class="list-header">
    <h2>Department List</h2>
    <p>All departments in the organization</p>
  </div>

  <div class="table-container">

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Department Name</th>
          <th>Location</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let department of departments">

          <td>{{ department.id }}</td>

          <td>{{ department.name }}</td>

          <td>{{ department.location }}</td>

          <td>
    
            <button
                type="button"
                class="edit-button"
                (click)="editDepartment(department)"
            >
                Edit
            </button>
    
            <button
                type="button"
                class="delete-button"
                (click)="deleteDepartment(department.id)"
            >
                Delete
            </button>

        </tr>

      </tbody>

    </table>

  </div>

</div>
